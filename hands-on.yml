Q. Requirement:

Deploy Salesforce when:
Tests succeeded 
AND
(environment is DP01 OR DP05)
AND
branch is either main OR release

- stage: Deploy
  dependsOn: Test
  condition: and(
             succeeded(),
             or(
               eq(variables['environment'], 'DP01'),
               eq(variables['environment'], 'DP05')
             ),
             or(
               eq(variables['Build.SourceBranch'], 'refs/heads/main'),
               eq(variables['Build.SourceBranch'], 'refs/heads/release')
             )
             )


Q. Requirement:
Deploy Salesforce only when:
Tests succeeded
AND
environment is DP01 OR DP05
AND
branch is main OR release
AND
environment is NOT Production

- stage: Deploy
  dependsOn: Test
  condition: and(
             succeeded(),
             or(
               eq(variables['environment'], 'DP01'),
               eq(variables['environment'], 'DP05')
             ),
             or(
               eq(variables['Build.SourceBranch'], 'refs/heads/main'),
               eq(variables['Build.SourceBranch'], 'refs/heads/release')
             ),
               ne(variables['environment'], 'Production')
             )

