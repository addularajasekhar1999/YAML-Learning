Q. Requirement : Cleanup must run regardless of the result of Test.
 
 - stage: Cleanup
   dependsOn: Test
   condition: always()


Q. Requirement : PublishResults should run if Test succeeded OR failed.

 - stage: PublishResults
   dependsOn: Test
   condition: succeededOrFailed()

Q. Run the deployment when the environment is DP01, DP05, or UAT.

 - stage: Deploy
   dependsOn: Test
   condition: in(
              variables['environment'],
              'DP01',
              'DP05',
              'UAT'
              )

Note: 🧠 in() vs or(eq())

These two can express the same idea:
or() approach
or(
  eq(variables['environment'], 'DP01'),
  eq(variables['environment'], 'DP05'),
  eq(variables['environment'], 'UAT')
)
in() approach
in(
  variables['environment'],
  'DP01',
  'DP05',
  'UAT'
)

Think:

in() = "Is this value inside my allowed list?"

This is very useful when your pipeline has multiple environments.

